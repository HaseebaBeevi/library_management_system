<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Book | NovellaHub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-[#F5EFE5] text-[#34351F]">
    <div class="flex min-h-screen">

      <!-- Sidebar -->
      <aside class="w-64 shrink-0 bg-[#4D512F] p-6 text-[#D6C7B5]">
        <h2
          class="text-[#D4B56A] text-2xl font-bold tracking-wide flex items-center gap-2"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v16" />
            <path
              d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"
            />
          </svg>
          NovellaHub
        </h2>

        <p class="mt-2 text-sm">Library Management System</p>

        <!-- Navigation Menu -->
        <nav class="mt-10 space-y-2">
         <a
            href="/"
            class="flex items-center gap-3 text-[#D6C7B5] hover:bg-[#626744] rounded-lg px-4 py-3 text-sm"
          >
            <span>🏠</span>
            <span>Dashboard</span>
          </a>

          <a
            href="/books"
            class="flex items-center gap-3 text-[#D6C7B5] hover:bg-[#626744] rounded-lg px-4 py-3 text-sm"
          >
            <span>📚</span>
            <span>View Books</span>
          </a>
 
          <a
            href="/add-book"
            class="flex items-center gap-3 bg-[#D4B56A] text-[#34351F] rounded-lg px-4 py-3 text-sm"
          >
            <span>➕</span>
            <span>Add Book</span>
          </a>

          <a
            href="/search"
            class="flex items-center gap-3 text-[#D6C7B5] hover:bg-[#626744] rounded-lg px-4 py-3 text-sm"
          >
            <span>🔍</span>
            <span>Search Book</span>
          </a>

          <a
            href="/issue-book"
            class="flex items-center gap-3 text-[#D6C7B5] hover:bg-[#626744] rounded-lg px-4 py-3 text-sm"
          >
            <span>📤</span>
            <span>Issue Book</span>
          </a>

          <a
            href="/return-book"
            class="flex items-center gap-3 text-[#D6C7B5] hover:bg-[#626744] rounded-lg px-4 py-3 text-sm"
          >
            <span>📥</span>
            <span>Return Book</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="min-w-0 flex-1 p-8">

        <!-- Top Bar -->
        <div
          class="mb-8 flex items-center justify-between border-b border-[#E5DCCE] pb-4"
        >
          <div>
            <h1 class="text-2xl font-bold">Add Book</h1>
            <p class="mt-1 text-sm text-[#827965]">
              Add a new book to your library collection.
            </p>
          </div>

          <span class="text-2xl">👤</span>
        </div>

        <!-- Add Book Form -->
        <div class="mx-auto max-w-2xl">
          <div
            class="rounded-xl border border-[#E5DCCE] bg-white p-6 shadow-sm"
          >
            <div class="mb-6">
              <h2 class="text-lg font-bold">Book Details</h2>
              <p class="mt-1 text-sm text-[#827965]">
                Enter the information below.
              </p>
            </div>

            <form
              id="addBookForm"
              action="/add-book"
              method="POST"
              class="space-y-5"
            >

              <!-- Book ID -->
              <div>
                <label for="bookId" class="mb-2 block text-sm font-medium">
                  Book ID
                </label>

                <input
                  type="number"
                  id="bookId"
                  name="bookId"
                  placeholder="Enter book ID"
                  required
                  min="1"
                  class="w-full rounded-lg border border-[#E5DCCE] bg-[#FDFBF7] px-4 py-3 text-sm outline-none focus:border-[#D4B56A]"
                />
              </div>

              <!-- Title -->
              <div>
                <label for="title" class="mb-2 block text-sm font-medium">
                  Book Title
                </label>

                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="Enter book title"
                  required
                  class="w-full rounded-lg border border-[#E5DCCE] bg-[#FDFBF7] px-4 py-3 text-sm outline-none focus:border-[#D4B56A]"
                />
              </div>

              <!-- Author -->
              <div>
                <label for="author" class="mb-2 block text-sm font-medium">
                  Author
                </label>

                <input
                  type="text"
                  id="author"
                  name="author"
                  placeholder="Enter author name"
                  required
                  class="w-full rounded-lg border border-[#E5DCCE] bg-[#FDFBF7] px-4 py-3 text-sm outline-none focus:border-[#D4B56A]"
                />
              </div>

              <!-- Quantity -->
              <div>
                <label for="quantity" class="mb-2 block text-sm font-medium">
                  Total Quantity
                </label>

                <input
                  type="number"
                  id="quantity"
                  name="quantity"
                  placeholder="Enter quantity"
                  required
                  min="1"
                  class="w-full rounded-lg border border-[#E5DCCE] bg-[#FDFBF7] px-4 py-3 text-sm outline-none focus:border-[#D4B56A]"
                />
              </div>

              <!-- Price -->
              <div>
                <label for="price" class="mb-2 block text-sm font-medium">
                  Price (₹)
                </label>

                <input
                  type="number"
                  id="price"
                  name="price"
                  placeholder="Enter book price"
                  required
                  min="1"
                  step="0.01"
                  class="w-full rounded-lg border border-[#E5DCCE] bg-[#FDFBF7] px-4 py-3 text-sm outline-none focus:border-[#D4B56A]"
                />
              </div>

              <!-- Buttons -->
              <div class="flex gap-3 pt-2">
                <button
                  type="submit"
                  class="flex-1 rounded-lg bg-[#4D512F] px-5 py-3 text-sm font-semibold text-white transition hover:bg-[#626744]"
                >
                  + Add Book
                </button>

                <button
                  type="reset"
                  class="rounded-lg border border-[#E5DCCE] px-5 py-3 text-sm font-medium hover:bg-[#F5EFE5]"
                >
                  Clear
                </button>
              </div>

              <!-- Form Message -->
              {% if message %}
              <p id="formMessage" class="text-sm text-[#9B4444]">
                {{ message }}
              </p>
              {% endif %}

            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
